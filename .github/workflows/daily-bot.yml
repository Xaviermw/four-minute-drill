# Coach Bot: plays today's daily and posts the "beat the Coach" challenge with
# a raceable ghost link. Runs every morning; with no secrets configured it's a
# dry run whose post text lands in the job summary for manual copy-paste.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   BLUESKY_IDENTIFIER, BLUESKY_APP_PASSWORD          -> enables Bluesky
#   X_APP_KEY, X_APP_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET -> enables X
name: daily-bot

on:
  schedule:
    - cron: "5 14 * * *" # 10:05am ET in summer (9:05 in winter)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 = same npm major (11) as the machine that generates
          # package-lock.json -- npm 10 (Node 22) rejects its @emnapi edges.
          # Also satisfies @supabase/* engines (>=22).
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Free-tier Supabase pauses after ~7 idle days and takes the leaderboard
      # down with it (DNS vanishes). One daily read keeps it awake AND turns
      # this job red -- which emails the owner -- the day the backend is
      # unreachable. URL + anon key are scraped from the live bundle: both are
      # public by design, and this always matches what production ships.
      - name: Keep Supabase awake (and alert if it is down)
        run: |
          bundle_path=$(curl -sf https://www.fourminutedrill.com/ | grep -oE 'assets/index-[^"]+\.js' | head -1)
          bundle=$(curl -sf "https://www.fourminutedrill.com/${bundle_path}")
          url=$(echo "$bundle" | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -1)
          key=$(echo "$bundle" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+' | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "::error::Could not extract Supabase config from the live bundle"; exit 1; fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$url/rest/v1/scores?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Supabase ping: HTTP $status"
          if [ "$status" != "200" ]; then echo "::error::Supabase unreachable (HTTP $status) -- the project may be paused; restore it at supabase.com"; exit 1; fi
      - name: Play the daily and post
        run: npx tsx scripts/daily-bot.ts
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
